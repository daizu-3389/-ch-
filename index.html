<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>名無し世界の掲示板</title>
    <style>
        /* 2ch全盛期のパピルス背景と無骨なテキスト */
        body { background-color: #fafaf0; color: #000000; font-family: "MS Pゴシック", "MS PGothic", "Mona", "Noto Sans JP", sans-serif; font-size: 14px; margin: 12px; padding: 0; line-height: 1.4; }
        a { color: #0000ff; text-decoration: underline; cursor: pointer; }
        a:hover { color: #ff0000; }
        
        .view-section { display: none; }
        .view-section.active { display: block; }
        
        /* テキストナビバー */
        .nav-text { font-size: 12px; background-color: #efefef; border: 1px solid #ccc; padding: 4px 8px; margin-bottom: 15px; color: #333; }
        
        h1.site-title { color: #ff0000; font-size: 26px; text-align: center; margin: 0; font-weight: bold; }
        .sub-title { font-size: 12px; text-align: center; margin-bottom: 20px; color: #000; }

        /* 🔄 左右2分割レイアウト用のスタイル */
        .split-container { display: flex; gap: 15px; margin-top: 15px; align-items: flex-start; }
        
        /* 📁 左側：常時表示のコンパクト板一覧（サイドバー） */
        .sidebar-box { width: 220px; flex-shrink: 0; background-color: #efefef; border: 1px solid #ccc; padding: 10px; max-height: 85vh; overflow-y: auto; position: sticky; top: 10px; }
        .sidebar-box .cat-title { font-weight: bold; color: #af0000; margin-top: 10px; font-size: 12px; border-bottom: 1px dashed #999; padding-bottom: 2px; }
        .sidebar-box .cat-title:first-child { margin-top: 0; }
        .sidebar-box .board-links-area { padding: 4px 0 4px 5px; line-height: 1.7; }
        .sidebar-box .board-link { font-size: 12px; margin-right: 8px; display: inline-block; }

        /* 📖 右側：メインコンテンツ表示エリア */
        .main-content-box { flex-grow: 1; min-width: 0; }

        /* 💬 スレッド一覧 */
        .board-title { color: #ff0000; font-size: 20px; font-weight: bold; margin-bottom: 10px; border-bottom: 1px solid #ccc; padding-bottom: 3px; }
        .thread-list-box { background-color: #fff; border: 1px solid #ccc; padding: 10px; }
        .thread-line { margin-bottom: 6px; font-size: 14px; }

        /* 📖 スレッド内部（伝統のdt/dd構造） */
        .thread-header-title { color: #ff0000; font-size: 22px; font-weight: bold; margin: 10px 0 15px 0; border-bottom: 2px solid #ff0000; padding-bottom: 3px; }
        .posts-box { background-color: #fff; border: 1px solid #ccc; padding: 15px; }
        
        .post-group { scroll-margin-top: 40px; }
        .post-group:target { background-color: #fff0cc; }

        .post-dt { font-size: 13px; margin-top: 16px; color: #000; }
        .post-dt b { color: #008000; } 
        .post-id { color: #666; font-family: monospace; margin-left: 5px; }
        .post-dd { margin-left: 25px; margin-top: 2px; margin-bottom: 15px; white-space: pre-wrap; word-break: break-all; font-size: 14px; color: #000; }

        .res-anchor { color: #0000ff; text-decoration: underline; }

        /* 📝 書き込みフォーム */
        .form-container { background-color: #efefef; border: 1px solid #ccc; padding: 10px; margin-top: 20px; max-width: 600px; }
        .form-container h3 { margin: 0 0 10px 0; font-size: 13px; color: #af0000; border-bottom: 1px solid #ccc; padding-bottom: 2px; }
        .form-row { margin-bottom: 6px; }
        .form-row label { font-size: 12px; font-weight: bold; display: inline-block; width: 90px; }
        .form-row input[type="text"] { width: 220px; border: 1px solid #aaa; font-size: 13px; padding: 2px; background: #fff; color: #000; }
        .form-row textarea { width: 100%; max-width: 500px; border: 1px solid #aaa; font-size: 14px; padding: 4px; font-family: inherit; background: #fff; color: #000; }
        .btn-submit { font-size: 12px; font-weight: bold; padding: 2px 15px; cursor: pointer; background: #eee; border: 1px solid #666; color: #000; }
        .btn-submit:hover { background: #ddd; }

        /* 🔒 名前ロック時の見た目（灰色にして操作不可にする） */
        input:disabled { background-color: #e0e0e0 !important; color: #666 !important; cursor: not-allowed; }
    </style>
</head>
<body>

    <div class="nav-text">
        <a id="navHomeBtn">■板一覧（ホーム）</a> ＞ <span id="currentLocationDisplay">トップページ</span>
    </div>

    <div class="main-container">
        <h1 class="site-title">名無し世界の掲示板</h1>
        <div class="sub-title">つーか、ネットの全住民が集う、完全最軽量リアルタイム2chロビー。</div>

        <div class="split-container">
            
            <div class="sidebar-box">
                <div style="font-size: 11px; font-weight: bold; margin-bottom: 5px; color: #666; border-bottom: 1px solid #ccc; padding-bottom: 2px;">📁 板メニュー</div>
                <div id="bbsMenuArea"></div>
            </div>

            <div class="main-content-box">
                
                <div id="welcomeView" class="view-section active">
                    <div style="background-color: #fff; border: 1px solid #ccc; padding: 30px; text-align: center; color: #444;">
                        <p style="font-weight: bold; font-size: 15px; margin: 0 0 10px 0; color: #ff0000;">★ 名無し世界の掲示板へようこそ！ ★</p>
                        <p style="margin: 0; font-size: 13px;">左側の「板メニュー」から、好きな掲示板を選択してください。</p>
                    </div>
                </div>

                <div id="threadListView" class="view-section">
                    <div class="board-title" id="currentBoardTitleDisplay">掲示板</div>
                    <div class="thread-list-box" id="threadList"></div>

                    <div class="form-container">
                        <h3>✨ 新しいスレッドを立てる</h3>
                        <div class="form-row"><label>タイトル：</label><input type="text" id="newThreadTitle" placeholder="スレタイを入力"></div>
                        <div class="form-row"><label>名前：</label><input type="text" id="threadCreatorName"></div>
                        <div class="form-row"><label>内容：</label><textarea id="threadFirstMessage" rows="3" placeholder="最初の書き込み内容"></textarea></div>
                        <button class="btn-submit" id="createThreadBtn">新規スレッド作成</button>
                    </div>
                </div>

                <div id="threadDetailView" class="view-section">
                    <a id="backToListViewBtn" style="font-size: 13px; font-weight: bold;">[ 📂 板のスレ一覧に戻る ]</a>
                    <div class="thread-header-title" id="currentThreadTitle">スレッドタイトル</div>
                    <div class="posts-box" id="postList"></div>

                    <div class="form-container">
                        <h3>このスレッドにレスを書き込む</h3>
                        <div class="form-row"><label>名前：</label><input type="text" id="postName"></div>
                        <div class="form-row"><label>本文：</label><textarea id="postMessage" rows="4" placeholder="ここに書き込むメッセージを入力"></textarea></div>
                        <button class="btn-submit" id="sendPostBtn">書き込む</button>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getDatabase, ref, push, onValue, set } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

        // 有さんのFirebase設定
        const firebaseConfig = {
            apiKey: "AIzaSyALgzyqyzbSLHX8sBCrtN5L7lNDL-c5HAM",
            authDomain: "my-2ch-bbs.firebaseapp.com",
            projectId: "my-2ch-bbs",
            storageBucket: "my-2ch-bbs.firebasestorage.app",
            messagingSenderId: "14772039514",
            appId: "1:14772039514:web:76f3aaf1d7e02fe2a3cd63",
            measurementId: "G-RKRMPEQKV0",
            databaseURL: "https://my-2ch-bbs-default-rtdb.asia-southeast1.firebasedatabase.app/"
        };

        const app = initializeApp(firebaseConfig);
        const database = getDatabase(app);

        // ---------------------------------------------------------
        // 【荒らし対策の設定】
        // ---------------------------------------------------------
        const COOLDOWN_MS = 10000; // クールタイム 10秒
        const MAX_LENGTH = 500;   // 文字数制限 500文字

        function validatePost(text) {
            if (text.length > MAX_LENGTH) {
                alert(`長すぎます。${MAX_LENGTH}文字以内で書いてください。`);
                return false;
            }
            const lastPostTime = localStorage.getItem("bbs_last_post_time");
            const now = Date.now();
            if (lastPostTime && (now - parseInt(lastPostTime) < COOLDOWN_MS)) {
                const waitTime = Math.ceil((COOLDOWN_MS - (now - parseInt(lastPostTime))) / 1000);
                alert(`連投制限中です。あと${waitTime}秒待ってね。`);
                return false;
            }
            return true;
        }

        function updateLastPostTime() {
            localStorage.setItem("bbs_last_post_time", Date.now());
        }

        function parsePostText(text) {
            if (!text) return "";
            let escaped = text
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
            
            return escaped.replace(/&gt;&gt;(\d+)/g, '<a href="#post-$1" class="res-anchor">&gt;&gt;$1</a>');
        }
        // ---------------------------------------------------------

        const BOARD_DATA = {
            "■ 地震・速報・実況": {
                "namazu": "緊急地震速報", "headline": "ニュース速報", "livegalileo": "なんでも実況G", "liveanb": "実況ch", "livecx": "フジテレビ実況", "livetbs": "TBS実況", "livenhk": "NHK総合実況", "liventv": "日本テレビ実況", "liveasahi": "テレビ朝日実況", "livetx": "テレビ東京実況"
            },
            "■ ニュース・社会事情": {
                "newsplus": "ニュース速報＋", "mnewsplus": "芸スポ速報＋", "news4plus": "東アジアニュース＋", "dqnplus": "痛いニュース＋", "bizplus": "ビジネスニュース＋", "scienceplus": "科学ニュース＋", "wildplus": "国際ニュース＋", "shakai": "社会・世評", "justice": "裁判・司法"
            },
            "■ ネット機能・雑談": {
                "vip": "ニュー速VIP", "news4vip": "ニュー速VIP+", "zatsudan": "なんでも雑談", "morning": "朝生雑談", "tomorrow": "明日があるさ", "alone": "一人でお留守番", "lobby": "ロビー", "welcome": "新機能お試し"
            },
            "■ ゲーム・ハード・実況": {
                "game": "ゲーム実況", "smartphone": "スマホゲーム", "netgame": "ネトゲ実況", "hard": "ゲームハード", "retro": "レトロゲーム", "rpg": "RPG", "arc": "アーケード", "ff": "FF・DQ", "gal": "エロゲ批評", "board": "卓上ゲーム"
            },
            "■ アニメ・漫画・特撮": {
                "anime": "アニメ・マンガ", "comic": "少年漫画", "rcomic": "4コマ漫画", "voice": "声優", "moe": "萌えニュース", "subcul": "サブカル", "sfx": "特撮", "illust": "イラスト・CG"
            },
            "■ コンピュータ・ガジェット": {
                "pc": "PC・ガジェット", "jisaku": "自作PC", "mac": "Mac", "linux": "Linux", "iphone": "iPhone", "android": "Android", "software": "ソフトウェア", "program": "プログラミング", "network": "インターネット"
            },
            "■ 趣味・娯楽・オカルト": {
                "occult": "オカルト・都市伝説", "poverty": "ニュー速(嫌儲)", "army": "軍事・ミリタリー", "rail": "鉄道", "airline": "航空・飛行機", "car": "車・バイク", "camera": "カメラ", "watch": "時計", "uranai": "占い", "survival": "サバイバル"
            },
            "■ スポーツ・公営ギャンブル": {
                "baseball": "プロ野球速報", "soccer": "日本代表蹴球", "samurai": "野球日本代表", "sumo": "相撲", "basket": "バスケット", "keiba": "競馬", "kyotei": "競艇", "pachinko": "パチンコ・パチスロ"
            },
            "■ 芸能・音楽・映画": {
                "idol": "地下アイドル", "akb": "AKB48", "smap": "ジャニーズ", "m芸能": "芸能人・有名人", "music": "邦楽", "musicg": "洋楽", "cinema": "映画一般", "visual": "ヴィジュアル系", "drama": "テレビドラマ"
            },
            "■ 学問・理数・人文": {
                "history": "日本史", "whistory": "世界史", "physics": "物理", "math": "数学", "psy": "心理学", "gengo": "言語学", "philosophy": "哲学", "keizai": "経済学", "space": "宇宙・天文学"
            },
            "■ 生活・家庭・美容": {
                "cook": "料理・レシピ", "kankon": "冠婚葬祭", "baby": "育児・子育て", "kaden": "家電製品", "interior": "インテリア", "diet": "ダイエット", "mensbeauty": "メンズ美容", "fashion": "洋服・ファッション"
            },
            "■ 人生・メンタル・コミュニティ": {
                "lonely": "ぼっち・馴れ合い", "mental": "メンタルヘルス", "meikyu": "人生相談", "debt": "借金・生活苦", "job": "転職・就職", "part": "アルバイト", "shikaku": "資格全全", "jinsei": "生き方・人生"
            },
            "■ 各地・地域ローカル": {
                "hokkaido": "北海道", "tohoku": "東北", "tokyo": "東京", "kanagawa": "神奈川", "tokai": "東海", "kinki": "近畿", "osaka": "大阪", "chugoku": "中国地方", "shikoku": "四重", "kyushu": "九州"
            }
        };

        const ALL_BOARDS = {};
        for (let cat in BOARD_DATA) {
            for (let id in BOARD_DATA[cat]) { ALL_BOARDS[id] = BOARD_DATA[cat][id]; }
        }

        const bbsMenuArea = document.getElementById("bbsMenuArea");
        const welcomeView = document.getElementById("welcomeView");
        const threadListView = document.getElementById("threadListView");
        const threadDetailView = document.getElementById("threadDetailView");
        const navHomeBtn = document.getElementById("navHomeBtn");
        const currentLocationDisplay = document.getElementById("currentLocationDisplay");
        const currentBoardTitleDisplay = document.getElementById("currentBoardTitleDisplay");
        const threadList = document.getElementById("threadList");
        const postList = document.getElementById("postList");
        const currentThreadTitle = document.getElementById("currentThreadTitle");
        const newThreadTitleInput = document.getElementById("newThreadTitle");
        const threadCreatorNameInput = document.getElementById("threadCreatorName");
        const threadFirstMessageInput = document.getElementById("threadFirstMessage");
        const createThreadBtn = document.getElementById("createThreadBtn");
        const postNameInput = document.getElementById("postName");
        const postMessageInput = document.getElementById("postMessage");
        const sendPostBtn = document.getElementById("sendPostBtn");
        const backToListViewBtn = document.getElementById("backToListViewBtn");

        let currentBoardId = ""; 
        let currentThreadId = null;
        let threadUnsubscribe = null;
        let postUnsubscribe = null;

        // ---------------------------------------------------------
        // 🔒 【名前の一時ロック・管理機能（24時間制限）】
        // ---------------------------------------------------------
        function checkNameLock() {
            const lockUntil = localStorage.getItem("bbs_name_lock_until");
            const lockedName = localStorage.getItem("bbs_locked_username");
            const now = Date.now();

            if (lockUntil && parseInt(lockUntil) > now) {
                // 24時間以内のため名前を固定＆入力不可
                threadCreatorNameInput.value = lockedName;
                postNameInput.value = lockedName;
                threadCreatorNameInput.disabled = true;
                postNameInput.disabled = true;
                
                const remainingMs = parseInt(lockUntil) - now;
                const remainingHours = Math.ceil(remainingMs / (1000 * 60 * 60));
                threadCreatorNameInput.title = `名前は24時間ロックされています（残り約${remainingHours}時間）`;
                postNameInput.title = `名前は24時間ロックされています（残り約${remainingHours}時間）`;
            } else {
                // ロックがかかっていない、または24時間経過した
                threadCreatorNameInput.disabled = false;
                postNameInput.disabled = false;
                if (lockUntil) {
                    localStorage.removeItem("bbs_name_lock_until");
                    localStorage.removeItem("bbs_locked_username");
                }
                const savedName = localStorage.getItem("bbs_saved_username") || "名無しさん";
                threadCreatorNameInput.value = savedName;
                postNameInput.value = savedName;
            }
        }

        function lockName(name) {
            const lockUntil = localStorage.getItem("bbs_name_lock_until");
            if (lockUntil && parseInt(lockUntil) > Date.now()) return; // すでにロック中ならスルー

            const nominatedName = name.trim() || "名無しさん";
            const TWENTY_FOUR_HOURS = 24 * 60 * 60 * 1000;
            
            localStorage.setItem("bbs_name_lock_until", Date.now() + TWENTY_FOUR_HOURS);
            localStorage.setItem("bbs_locked_username", nominatedName);
            localStorage.setItem("bbs_saved_username", nominatedName);
            checkNameLock();
        }

        function saveName(name) {
            if (threadCreatorNameInput.disabled) return; // ロック時は無効化
            localStorage.setItem("bbs_saved_username", name);
            threadCreatorNameInput.value = name;
            postNameInput.value = name;
        }

        threadCreatorNameInput.addEventListener("input", (e) => saveName(e.target.value));
        postNameInput.addEventListener("input", (e) => saveName(e.target.value));
        
        // 起動時にロック状況を確認して画面に反映
        checkNameLock();
        // ---------------------------------------------------------

        function getTodayID() {
            let userKey = localStorage.getItem("bbs_user_secret_key");
            if (!userKey) {
                userKey = Math.random().toString(36).substring(2, 10);
                localStorage.setItem("bbs_user_secret_key", userKey);
            }
            const now = new Date();
            const mix = userKey + `${now.getFullYear()}${now.getMonth()+1}${now.getDate()}`;
            let hash = 0;
            for (let i = 0; i < mix.length; i++) { hash = (hash << 5) - hash + mix.charCodeAt(i); hash |= 0; }
            return Math.abs(hash).toString(36).substring(0, 8).toUpperCase();
        }

        function getNowString() {
            const now = new Date();
            const weekdays = ["日", "月", "火", "水", "木", "金", "土"];
            return `${now.getFullYear()}/${(now.getMonth()+1).toString().padStart(2,'0')}/${now.getDate().toString().padStart(2,'0')}(${weekdays[now.getDay()]}) ${now.getHours().toString().padStart(2,'0')}:${now.getMinutes().toString().padStart(2,'0')}:${now.getSeconds().toString().padStart(2,'0')}`;
        }

        function renderBbsMenu() {
            bbsMenuArea.innerHTML = "";
            for (let categoryName in BOARD_DATA) {
                const catTitle = document.createElement("div");
                catTitle.className = "cat-title";
                catTitle.textContent = categoryName;
                bbsMenuArea.appendChild(catTitle);
                
                const linksWrapper = document.createElement("div");
                linksWrapper.className = "board-links-area";
                
                for (let boardId in BOARD_DATA[categoryName]) {
                    const boardName = BOARD_DATA[categoryName][boardId];
                    const a = document.createElement("a");
                    a.className = "board-link";
                    a.textContent = boardName;
                    a.style.cursor = "pointer";
                    a.addEventListener("click", () => switchBoard(boardId));
                    linksWrapper.appendChild(a);
                    linksWrapper.appendChild(document.createTextNode(" "));
                }
                bbsMenuArea.appendChild(linksWrapper);
            }
        }

        function switchBoard(boardId) {
            currentBoardId = boardId;
            currentLocationDisplay.textContent = ALL_BOARDS[boardId];
            currentBoardTitleDisplay.textContent = `📂 ${ALL_BOARDS[boardId]} のスレッド一覧`;
            
            welcomeView.classList.remove("active");
            threadDetailView.classList.remove("active");
            threadListView.classList.add("active");
            loadThreadList(boardId);
        }

        navHomeBtn.addEventListener("click", () => {
            if (threadUnsubscribe) threadUnsubscribe();
            if (postUnsubscribe) postUnsubscribe();
            currentThreadId = null;
            currentLocationDisplay.textContent = "トップページ";
            threadListView.classList.remove("active");
            threadDetailView.classList.remove("active");
            welcomeView.classList.add("active");
        });

        function loadThreadList(boardId) {
            if (threadUnsubscribe) threadUnsubscribe();
            threadList.innerHTML = "<div style='color:#666; font-size:12px;'>読み込み中...</div>";
            const threadsRef = ref(database, 'threads/' + boardId);
            threadUnsubscribe = onValue(threadsRef, (snapshot) => {
                threadList.innerHTML = "";
                const data = snapshot.val();
                if (data) {
                    let index = 1;
                    for (let id in data) {
                        const thread = data[id];
                        const div = document.createElement("div");
                        div.className = "thread-line";
                        
                        const a = document.createElement("a");
                        a.textContent = thread.title;
                        a.style.cursor = "pointer";
                        a.addEventListener("click", () => openThread(id, thread.title));
                        
                        div.appendChild(document.createTextNode(`${index}: `));
                        div.appendChild(a);
                        threadList.appendChild(div);
                        index++;
                    }
                } else {
                    threadList.innerHTML = "<div style='color:#666; font-size:12px;'>スレッドがありません。</div>";
                }
            });
        }

        function openThread(threadId, threadTitle) {
            currentThreadId = threadId;
            currentThreadTitle.textContent = threadTitle;
            currentLocationDisplay.textContent = threadTitle;
            threadListView.classList.remove("active");
            threadDetailView.classList.add("active");
            
            if (postUnsubscribe) postUnsubscribe();
            postList.innerHTML = "<div style='color:#666; font-size:12px;'>読み込み中...</div>";
            const postsRef = ref(database, 'posts/' + threadId);
            postUnsubscribe = onValue(postsRef, (snapshot) => {
                postList.innerHTML = "";
                const data = snapshot.val();
                if (data) {
                    let count = 1;
                    for (let id in data) {
                        const post = data[id];
                        
                        const postGroup = document.createElement("div");
                        postGroup.className = "post-group";
                        postGroup.id = `post-${count}`;

                        const dt = document.createElement("div");
                        dt.className = "post-dt";
                        dt.innerHTML = `${count} ：<b>${post.name}</b> ：${post.time} <span class="post-id">${post.uid ? 'ID:'+post.uid : 'ID:???'}</span>`;
                        
                        const dd = document.createElement("div");
                        dd.className = "post-dd";
                        dd.innerHTML = parsePostText(post.text);
                        
                        postGroup.appendChild(dt);
                        postGroup.appendChild(dd);
                        postList.appendChild(postGroup);
                        count++;
                    }
                }
            });
        }

        backToListViewBtn.addEventListener("click", () => {
            threadDetailView.classList.remove("active");
            threadListView.classList.add("active");
            currentLocationDisplay.textContent = ALL_BOARDS[currentBoardId];
            if (postUnsubscribe) postUnsubscribe();
            currentThreadId = null;
        });

        createThreadBtn.addEventListener("click", () => {
            const title = newThreadTitleInput.value.trim();
            const name = threadCreatorNameInput.value.trim() || "名無しさん";
            const firstMsg = threadFirstMessageInput.value.trim();
            
            if (!title || !firstMsg) return alert("タイトルと内容を入力してね");
            if (!validatePost(firstMsg)) return;

            const timeStr = getNowString();
            const userId = getTodayID();
            const boardThreadsRef = ref(database, 'threads/' + currentBoardId);
            const newThreadRef = push(boardThreadsRef);
            const newThreadId = newThreadRef.key;
            
            set(newThreadRef, { title: title, createdAt: timeStr }).then(() => {
                push(ref(database, 'posts/' + newThreadId), { name: name, text: firstMsg, time: timeStr, uid: userId });
                
                // 🌟 スレ立て成功時にこの名前を24時間ロックする
                lockName(name);
                updateLastPostTime();
                
                newThreadTitleInput.value = "";
                threadFirstMessageInput.value = "";
                openThread(newThreadId, title);
            });
        });

        sendPostBtn.addEventListener("click", () => {
            const name = postNameInput.value.trim() || "名無しさん";
            const text = postMessageInput.value.trim();
            
            if (!text) return alert("本文を入力してください");
            if (!validatePost(text)) return;
            
            push(ref(database, 'posts/' + currentThreadId), { name: name, text: text, time: getNowString(), uid: getTodayID() }).then(() => {
                
                // 🌟 レス書き込み成功時にこの名前を24時間ロックする
                lockName(name);
                updateLastPostTime();
                postMessageInput.value = "";
            });
        });

        renderBbsMenu();
    </script>
</body>
</html>
